name: sokoni_driver
description: "Sokoni Driver: delivery app for Sokoni's boda boda, bajaj, car and bicycle drivers."
publish_to: 'none'

# Android applicationId / iOS bundle id: tz.co.sokoni.driver
version: 0.1.0+1

environment:
  sdk: ^3.11.4

# Versions mirror app/pubspec.yaml wherever the same package is used, so
# both apps move together. See that file for why flutter_secure_storage
# and win32 are pinned.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  dio: ^5.11.0
  retrofit: ^4.9.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.6.0+eol
  flutter_secure_storage: ^9.2.4
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.3
  intl: ^0.20.3
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  path_provider: ^2.1.6
  path: ^1.9.1
  connectivity_plus: ^7.3.1
  firebase_auth: ^6.7.1
  firebase_database: ^12.6.1

dependency_overrides:
  win32: ^5.9.0
  # Same reason as app/pubspec.yaml: 10.x needs win32 6.x, which breaks the
  # Windows build of the 5.x pin above. No effect on Android/iOS.
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  retrofit_generator: ^10.2.8
  drift_dev: ^2.34.0
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  image: ^4.12.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/driver_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/brand/driver_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/brand/sokoni_logo.png

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
