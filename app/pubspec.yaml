name: sokoni
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  go_router: ^17.5.0
  dio: ^5.11.0
  retrofit: ^4.9.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.6.0+eol
  # Pinned below ^11.0.0 (Android: compileSdk 37, an unreleased/preview API
  # level not resolvable in this SDK install) and below ^10.3.1 in turn
  # (its flutter_secure_storage_windows dependency needs win32 6.x, which
  # conflicts with the win32 5.x pin file_picker needs below) — 9.2.4 is
  # the newest line compatible with both. Windows is a dev-machine-only
  # concern (this app ships Android/iOS only) but Dart's whole-program
  # kernel compilation type-checks every reachable package regardless of
  # build target, so a Windows-incompatible transitive dependency still
  # fails `flutter build apk` on this machine. See DECISIONS.md.
  flutter_secure_storage: ^9.2.4
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  cached_network_image: ^3.4.1
  flutter_image_compress: ^2.5.1
  video_player: ^2.11.1
  chewie: ^1.15.0
  video_compress: ^3.1.4
  visibility_detector: ^0.4.0+2
  shimmer: ^3.0.0
  google_fonts: ^8.2.1
  intl: ^0.20.3
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  file_picker: ^11.0.3
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^6.0.4
  sign_in_with_apple: ^8.1.0
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.1
  path: ^1.9.1

# win32 is a transitive Windows-desktop-only dependency pulled in by file_picker,
# share_plus and wakelock_plus. This app only targets Android/iOS, so the actual
# win32 API surface is never compiled into the app — this override only settles
# a semver mismatch between those three packages' pinned win32 ranges. Pinned to
# the 5.x line (not 6.x): file_picker 11.0.3's Windows implementation is written
# against win32 5.x's API and fails to compile under 6.x's breaking changes
# (HRESULT typedef, renamed FFI helpers) — see DECISIONS.md.
#
# package_info_plus is pinned below its normally-resolved 10.x for the same
# reason, in the opposite direction: 10.x requires win32 ^6.0.1, which is
# incompatible with the 5.x pin above. 9.0.0 targets win32 ^5.5.3 and is
# otherwise a drop-in — nothing in this app calls package_info_plus
# directly, it's pulled in transitively by other packages' Windows/desktop
# support code, so the version bump has no functional effect on Android/iOS.
dependency_overrides:
  win32: ^5.9.0
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4
  retrofit_generator: ^10.2.8
  drift_dev: ^2.34.0
  freezed: ^3.2.5
  json_serializable: ^6.14.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/sokoni_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/brand/sokoni_logo.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/brand/sokoni_logo.png"
  color_dark: "#0E0E0E"
  image_dark: "assets/brand/sokoni_logo.png"
  android_12:
    image: "assets/brand/sokoni_logo.png"
    icon_background_color: "#FFFFFF"
    image_dark: "assets/brand/sokoni_logo.png"
    icon_background_color_dark: "#0E0E0E"
  android: true
  ios: true

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/brand/sokoni_logo.png
