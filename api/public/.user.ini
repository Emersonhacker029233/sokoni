; Part 1 (client feedback, urgent): "an uploaded banner never appears —
; stuck on loading." diagnose-banners (setup.php) confirmed this host's
; default upload_max_filesize/post_max_size leave little to no headroom
; over BannerForm's own 2MB client-side cap — multipart encoding overhead
; alone can push a borderline upload over a limit set to the same number,
; and PHP rejects the request before Laravel (or Livewire's own upload
; handler) ever sees it, which is exactly what an indefinitely "loading"
; admin upload looks like from the browser's side.
;
; .user.ini is the standard way to raise these on shared hosting without
; shell/WHM access — LiteSpeed's PHP handler (this host: see the
; x-turbo-charged-by response header) honours it the same way PHP-FPM
; does, refreshed on its own periodic cache interval (commonly a few
; minutes) rather than needing a server restart.
upload_max_filesize = 12M
post_max_size = 15M
